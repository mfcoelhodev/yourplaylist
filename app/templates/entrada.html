{% extends "base.html" %}
{% block title %}Entrada{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8 p-6 bg-green-500 text-black rounded-lg shadow-md">
    <h1 class="text-xl font-bold mb-4">Playlist</h1>

    <form action="/entrada" method="POST" class="space-y-4">

        <div>
            <label for="playlist" class="block text-sm font-medium text-gray-700">Escolha uma playlist do {{entrada}}:</label>
            <select 
                id="playlist" 
                name="playlist" 
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                <option value="">Selecione uma playlist</option>
                {% for playlist in playlists %}
                <option value="{{playlist}}">{{playlist}}</option>
                {% endfor %}
            </select>
        </div>
        <button 
            type="submit" 
            class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
            Enviar
        </button>
    </form>

</div>
{% endblock %}
