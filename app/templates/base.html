<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Template</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {},
            },
        };
    </script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body class="bg-gray-100 text-gray-900 bg-cover bg-center" style="background-image: url('{{ url_for('static', filename='images/background.png') }}');">
    <header class="bg-green-500 text-black p-4 flex justify-between items-center">
        <a href="/" title="Voltar para página principal">
        <h1 class="text-xl font-bold">YourPlaylist</h1>
        </a>
        <nav>
            <div class="github-icon">
                <a href="https://github.com/mfcoelhodev" target="_blank" title="Visitar meu github">
                    <img src="{{ url_for('static', filename='images/github-icon.png') }}" alt="GitHub" class="w-8 h-8">
                </a>
            </div>
        </nav>
    </header>
    <main class="p-6">
        <!-- Conteúdo das outras páginas será adicionado aqui -->
        <div class="container">{%block content%}{%endblock%}</div>
    </main>
</body>
</html>
