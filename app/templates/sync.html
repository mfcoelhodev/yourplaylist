<!-- ARRUMAR -->
{% extends "base.html" %}

{% block title %}Sincronizar{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8 p-6 bg-green-500 text-black rounded-lg shadow-md">
    <h1 class="text-xl font-bold mb-4">Sincronizar</h1>
    <form action="/synchronize" method="POST" class="space-y-4">
        <div>
            <label for="primeira" class="block text-sm font-medium text-gray-700">Escolha uma plataforma:</label>
            <select 
                id="primeira" 
                name="primeira" 
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                <option value="">Selecione uma plataforma</option>
                <option value="youtube">YouTube</option>
                <option value="spotify">Spotify</option>
            </select>
        </div>

        <div>
            <label for="segunda" class="block text-sm font-medium text-gray-700">Escolha uma segunda plataforma:</label>
            <select 
                id="segunda" 
                name="segunda" 
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                <option value="">Selecione uma plataforma</option>
                <option value="youtube">YouTube</option>
                <option value="spotify">Spotify</option>
            </select>
        </div>

         <button
            type="submit" 
            class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
            Enviar
        </button>
    </form>

</div>
<script>
    document.getElementById('primeira').addEventListener('change', function () {
        const selectedInput = this.value; // Obtém o valor selecionado no menu de entrada
        const outputSelect = document.getElementById('segunda'); // Referência ao menu de saída

        // Reativa todas as opções no menu de saída
        Array.from(outputSelect.options).forEach(option => {
            option.disabled = false;
        });

        // Desativa a opção correspondente ao menu de entrada
        Array.from(outputSelect.options).forEach(option => {
            if (option.value === selectedInput && selectedInput !== "") {
                option.disabled = true;
            }
        });
    });
</script>

{% endblock %}
