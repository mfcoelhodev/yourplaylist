{% extends "base.html" %}
{% block title %}Finalizando{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8 p-6 bg-green-500 text-black rounded-lg shadow-md">
    <h1 class="text-xl font-bold mb-4">Fazendo Download</h1>
    <div id="transfer-container">
        <div id="loading" class="flex justify-center items-center space-x-2">
            <div class="w-6 h-6 border-4 border-t-4 border-gray-300 border-t-blue-500 rounded-full animate-spin"></div>
            <span class="text-gray-500">Preparando Downloads...</span>
        </div>

        <!-- Progress container -->
        <div id="progress-container" class="hidden mt-4">
            <h3 class="text-sm font-semibold text-gray-700 mb-2">Baixando</h3>
            <div id="progress-list"></div>
            
            <!-- Mensagem de sucesso (inicialmente escondida) -->
            <div id="completion-message" class="hidden mt-4 p-3 bg-green-500 rounded-lg">
                <div class=" flex justify-center nt-bold text-green mb-4">
                    ✨ Playlist Baixada! ✨
                </div>
                <div class="flex justify-center">
                <a href="/" 
                class="justify-center px-6 py-2 bg-blue-500 text-black rounded-lg hover:bg-blue-700 transition-colors">
                    Voltar
                </a>
                </div>
            </div>
        </div>

        <!-- HTMX trigger para iniciar downloads -->
        <div hx-post="/download" 
             hx-target="#loading" 
             hx-trigger="load"
             hx-swap="outerHTML">
        </div>
    </div>

    <script>
        let progressCheckInterval;
        let lastDataLength = 0;
        let completionCounter = 0;

        document.addEventListener('DOMContentLoaded', function() {
            startProgressCheck();
        });

        function startProgressCheck() {
            checkProgress();
            progressCheckInterval = setInterval(checkProgress, 2000);
        }

        function checkProgress() {
            fetch('/progress')
                .then(response => response.json())
                .then(data => {
                    let progressContainer = document.getElementById("progress-container");
                    let progressList = document.getElementById("progress-list");
                    let completionMessage = document.getElementById("completion-message");
                    
                    if (Object.keys(data).length > 0) {
                        // Mostra container de progresso do download da música
                        progressContainer.classList.remove("hidden");
                        let loadingElement = document.getElementById("loading");
                        if (loadingElement) {
                            loadingElement.remove();
                        }
                        
                        // Update progress list
                        progressList.innerHTML = "";
                        let allCompleted = true;
                        
                        for (let videoId in data) {
                            let video = data[videoId];
                            if (video.status !== 'Completed') {
                                allCompleted = false;
                            }
                            
                            let progressHTML = `
                                <div class="mb-4 bg-white p-3 rounded-lg shadow">
                                    <p class="text-sm text-gray-800 font-semibold mb-1">${video.title}</p>
                                    <div class="relative pt-1">
                                        <div class="overflow-hidden h-2 mb-2 text-xs flex rounded bg-gray-200">
                                            <div style="width: ${video.percent};" 
                                                 class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center ${video.status === 'Completed' ? 'bg-green-500' : 'bg-blue-500'}">
                                            </div>
                                        </div>
                                        <div class="flex justify-between text-xs text-gray-600">
                                            <span>${video.percent}</span>
                                            <span>${video.status === 'Completed' ? 'Completed' : `${video.speed}, ETA: ${video.eta}s`}</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                            progressList.innerHTML += progressHTML;
                        }

                        // Verifica se Todos downloads foram realizados
                        if (Object.keys(data).length === lastDataLength && allCompleted) {
                            completionCounter++;
                            if (completionCounter >= 2) { // Faz dupla checagem para mostrar mensagem de confirmação
                                completionMessage.classList.remove("hidden");
                                clearInterval(progressCheckInterval);
                                fetch('/download_completed') //Faz um get para acionar um evento e não deixar pontas soltas
                            }
                        } else {
                            completionCounter = 0;
                        }
                        
                        lastDataLength = Object.keys(data).length;
                    }
                })
                .catch(error => {
                    console.error('Error fetching progress:', error);
                });
        }
    </script>
</div>
{% endblock %}
