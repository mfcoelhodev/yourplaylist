{% extends "base.html" %}

{% block title %}conexao_spo{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-green-500 p-6 rounded shadow">
    <div class="justify-center">
    <h1 class="text-2xl font-bold mb-4">Conectando Plataformas</h1>
    </div>
    <p class="mb-6">
        Cole abaixo o link da página do Google para a qual foi redirecionado.
    </p>
        <!-- icone de carregamento -->
        <div id="loading" class="flex justify-center items-center space-x-2">
            <div class="w-6 h-6 border-4 border-t-4 border-gray-300 border-t-blue-500 rounded-full animate-spin"></div>
            <span class="text-gray-500">Fazendo autenticação...</span>
        </div>
        <div class="flex justify-center items-center space-x-2">
        <form action="/conexao_spotify" method="POST" class="space-y-4">

            <div>
                <label for="playlist" class="block text-sm font-medium text-gray-700">Cole a url:</label>
                <input type="text" id="url" name="url" required><br><br>
            </div>
            <button 
                type="submit" 
                class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                Enviar
            </button>
        </form>
        </div>
</div>
{% endblock %}
